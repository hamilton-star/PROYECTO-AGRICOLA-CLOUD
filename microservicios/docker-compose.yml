services:
  compradores-db:
    image: postgres:16-alpine
    container_name: compradores-db
    environment:
      POSTGRES_DB: compradores_db
      POSTGRES_USER: compradores_user
      POSTGRES_PASSWORD: compradores123
    volumes:
      - compradores_pgdata:/var/lib/postgresql/data
      - ./compradores/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compradores_user -d compradores_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  compradores-app:
    build: ./compradores
    container_name: compradores-app
    ports:
      - "3011:3001"
    environment:
      PORT: 3001
      DB_HOST: compradores-db
      DB_PORT: 5432
      DB_NAME: compradores_db
      DB_USER: compradores_user
      DB_PASSWORD: compradores123
    depends_on:
      compradores-db:
        condition: service_healthy

  productos-db:
    image: postgres:16-alpine
    container_name: productos-db
    environment:
      POSTGRES_DB: productos_db
      POSTGRES_USER: productos_user
      POSTGRES_PASSWORD: productos123
    volumes:
      - productos_pgdata:/var/lib/postgresql/data
      - ./productos-catalogo/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productos_user -d productos_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  productos-app:
    build: ./productos-catalogo
    container_name: productos-app
    ports:
      - "3012:3002"
    environment:
      PORT: 3002
      DB_HOST: productos-db
      DB_PORT: 5432
      DB_NAME: productos_db
      DB_USER: productos_user
      DB_PASSWORD: productos123
      PRODUCTORES_URL: http://productores-app:3004
      USUARIOS_URL: http://usuarios-app:3003
    depends_on:
      productos-db:
        condition: service_healthy

  usuarios-app:
    build: ./usuarios
    container_name: usuarios-app
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: usuarios-db
      DB_PORT: 5432
      DB_NAME: usuarios_db
      DB_USER: usuarios_user
      DB_PASSWORD: usuarios123
    depends_on:
      usuarios-db:
        condition: service_healthy

  usuarios-db:
    image: postgres:16
    container_name: usuarios-db
    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: usuarios_user
      POSTGRES_PASSWORD: usuarios123
    volumes:
      - usuarios_pgdata:/var/lib/postgresql/data
      - ./usuarios/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuarios_user -d usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  productores-app:
    build: ./productores
    container_name: productores-app
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_HOST: productores-db
      DB_PORT: 5432
      DB_NAME: productores_db
      DB_USER: productores_user
      DB_PASSWORD: productores123
    depends_on:
      productores-db:
        condition: service_healthy

  productores-db:
    image: postgres:16
    container_name: productores-db
    environment:
      POSTGRES_DB: productores_db
      POSTGRES_USER: productores_user
      POSTGRES_PASSWORD: productores123
    volumes:
      - productores_pgdata:/var/lib/postgresql/data
      - ./productores/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productores_user -d productores_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pedidos-db:
    image: postgres:16-alpine
    container_name: pedidos-db
    environment:
      POSTGRES_DB: pedidos_db
      POSTGRES_USER: pedidos_user
      POSTGRES_PASSWORD: pedidos123
    volumes:
      - pedidos_pgdata:/var/lib/postgresql/data
      - ./pedidos/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos_user -d pedidos_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  pedidos-app:
    build: ./pedidos
    container_name: pedidos-app
    ports:
      - "3015:3005"
    environment:
      PORT: 3005
      DB_HOST: pedidos-db
      DB_PORT: 5432
      DB_NAME: pedidos_db
      DB_USER: pedidos_user
      DB_PASSWORD: pedidos123
      COMPRADORES_URL: http://compradores-app:3001
      PRODUCTOS_URL: http://productos-app:3002
      NOTIFICACIONES_URL: http://notificaciones-app:3006
    depends_on:
      pedidos-db:
        condition: service_healthy
      compradores-app:
        condition: service_started
      productos-app:
        condition: service_started

  notificaciones-db:
    image: postgres:16-alpine
    container_name: notificaciones-db
    environment:
      POSTGRES_DB: notificaciones_db
      POSTGRES_USER: notificaciones_user
      POSTGRES_PASSWORD: notificaciones123
    volumes:
      - notificaciones_pgdata:/var/lib/postgresql/data
      - ./notificaciones/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notificaciones_user -d notificaciones_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  notificaciones-app:
    build: ./notificaciones
    container_name: notificaciones-app
    ports:
      - "3016:3006"
    environment:
      PORT: 3006
      DB_HOST: notificaciones-db
      DB_PORT: 5432
      DB_NAME: notificaciones_db
      DB_USER: notificaciones_user
      DB_PASSWORD: notificaciones123
    depends_on:
      notificaciones-db:
        condition: service_healthy

volumes:
  compradores_pgdata:
  productos_pgdata:
  usuarios_pgdata:
  productores_pgdata:
  pedidos_pgdata:
  notificaciones_pgdata:
